    <script>
      try {
        var t = localStorage.getItem('titanus-tema') || 'oscuro';
        var oscuro = t === 'oscuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = oscuro ? 'dark' : 'light';
      } catch (e) {}
    </script>

      @media (prefers-reduced-motion: reduce) { #inicio svg { animation: none; } }
    </style>
